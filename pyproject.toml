[project]
name = "shopcon"
version = "0.1.0"
description = "Shopping Concierge - ask for a product in plain English, get a ranked, reasoned shortlist. A minimal agentic-commerce demo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
shopcon = "shopcon.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopcon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
