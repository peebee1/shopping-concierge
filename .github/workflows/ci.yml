name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Tests
        run: uv run pytest -q

      # The README quotes a keyless evaluation number. This replays it against
      # the committed record, so the number cannot drift while CI stays green.
      - name: Evaluation gate
        run: uv run shopcon-eval --mock --check eval/mock_gate.json --min-pass 0.85 --min-gold 0.75
